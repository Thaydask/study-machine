<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de estudo</title>
<script src="dados.js"></script>
<style>
:root{
  --bg:#0e1211; --bg2:#121817; --sup:#161d1c; --sup2:#1b2322;
  --linha:#232d2b; --linha2:#2e3a38;
  --tx:#e6ebe9; --tx2:#9aa8a4; --tx3:#6b7975;
  --ac:#3ecf8e; --ac2:#2aa06d; --acfr:#13291f;
  --verde:#3ecf8e; --amb:#e0a33a; --verm:#e5675c; --cinza:#4d5a57;
  --r:14px; --r2:10px;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif:ui-serif,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,monospace;
  --sombra:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.28);
}
:root[data-tema="claro"]{
  --bg:#f4f6f4; --bg2:#ecefec; --sup:#ffffff; --sup2:#f7f9f7;
  --linha:#e0e5e1; --linha2:#ccd4ce;
  --tx:#16201d; --tx2:#5c6a65; --tx3:#8b9791;
  --ac:#1f9463; --ac2:#177a51; --acfr:#e6f4ed;
  --verde:#1f9463; --amb:#b07d17; --verm:#c4453a; --cinza:#a9b3af;
  --sombra:0 1px 2px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:light){:root:not([data-tema="escuro"]){
  --bg:#f4f6f4; --bg2:#ecefec; --sup:#ffffff; --sup2:#f7f9f7;
  --linha:#e0e5e1; --linha2:#ccd4ce;
  --tx:#16201d; --tx2:#5c6a65; --tx3:#8b9791;
  --ac:#1f9463; --ac2:#177a51; --acfr:#e6f4ed;
  --verde:#1f9463; --amb:#b07d17; --verm:#c4453a; --cinza:#a9b3af;
  --sombra:0 1px 2px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.06);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
svg{display:block;flex:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- esqueleto ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--bg2);border-right:1px solid var(--linha);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
main{min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--linha);padding:14px 34px}
.palco{padding:28px 34px 80px;width:100%;max-width:1380px;margin:0 auto}
.topoin{display:flex;align-items:center;gap:16px;width:100%;max-width:1380px;margin:0 auto}

/* ---------- barra lateral ---------- */
.marca{display:flex;align-items:center;gap:10px;padding:20px 20px 18px;
  border-bottom:1px solid var(--linha)}
.marca .nome{font-weight:650;letter-spacing:-.01em;font-size:15px;line-height:1.2}
.marca .sub{font-size:11px;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase}
.assunto{padding:18px 20px;border-bottom:1px solid var(--linha)}
.assunto .rot{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3)}
.assunto h1{font-size:17px;margin:6px 0 0;line-height:1.25;letter-spacing:-.015em;font-weight:640}
.assunto p{font-size:12.5px;color:var(--tx2);margin:8px 0 0;line-height:1.5}
.anel{padding:18px 20px;border-bottom:1px solid var(--linha)}
.anelb{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.anelb b{font-size:22px;font-weight:680;letter-spacing:-.02em}
.anelb span{font-size:12px;color:var(--tx2)}
.trilho{display:flex;height:7px;border-radius:99px;overflow:hidden;background:var(--linha2)}
.trilho i{display:block;height:100%}
.mini{margin-top:11px;display:grid;gap:5px}
.mini div{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx2)}
.mini b{color:var(--tx);font-weight:600;min-width:18px;text-align:right}
.pt{width:7px;height:7px;border-radius:99px;flex:none}
nav{padding:12px 12px;flex:1}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;margin-bottom:2px;
  background:none;border:0;border-radius:var(--r2);color:var(--tx2);cursor:pointer;
  font-size:14px;text-align:left;transition:background .12s,color .12s}
.nav:hover{background:var(--sup);color:var(--tx)}
.nav[aria-selected="true"]{background:var(--acfr);color:var(--ac);font-weight:600}
.nav[aria-selected="true"] svg{color:var(--ac)}
.nav .n{margin-left:auto;font-size:11px;font-weight:700;background:var(--ac);color:var(--bg);
  min-width:19px;height:19px;line-height:19px;border-radius:99px;text-align:center;padding:0 5px}
.rodape{padding:14px 20px;border-top:1px solid var(--linha);font-size:11.5px;color:var(--tx3);
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.rodape button{background:none;border:0;color:var(--tx3);cursor:pointer;padding:4px;
  border-radius:6px;display:flex}
.rodape button:hover{color:var(--tx);background:var(--sup)}

/* ---------- busca ---------- */
.busca{flex:1;max-width:420px;position:relative;display:flex;align-items:center}
.busca svg{position:absolute;left:11px;color:var(--tx3);pointer-events:none}
.busca input{width:100%;background:var(--sup);border:1px solid var(--linha);
  border-radius:var(--r2);padding:8px 12px 8px 34px;color:var(--tx);font:inherit;font-size:13.5px}
.busca input::placeholder{color:var(--tx3)}
.busca input:focus{outline:0;border-color:var(--ac2);background:var(--sup2)}
.kbd{margin-left:auto;font:11px var(--mono);color:var(--tx3);border:1px solid var(--linha);
  border-radius:5px;padding:2px 6px;background:var(--sup)}
.data{margin-left:auto;font-size:12.5px;color:var(--tx3);white-space:nowrap}

/* ---------- blocos ---------- */
.rot{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--tx3);font-weight:650;margin:30px 0 12px}
.rot:first-child{margin-top:0}
.rot svg{color:var(--tx3)}
.card{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);
  padding:19px 22px;box-shadow:var(--sombra);margin-bottom:12px}
.card.calma{background:var(--sup2);box-shadow:none}
.vazio{background:var(--sup2);border:1px dashed var(--linha2);border-radius:var(--r);
  padding:22px;color:var(--tx2);display:flex;gap:14px;align-items:flex-start}
.vazio svg{color:var(--tx3);margin-top:2px}
.vazio b{display:block;color:var(--tx);font-weight:600;margin-bottom:3px}
h2{font-size:19px;margin:0 0 6px;letter-spacing:-.02em;font-weight:650;line-height:1.25}
h3{font-size:15.5px;margin:0 0 4px;letter-spacing:-.01em;font-weight:620}
.meta{font-size:12.5px;color:var(--tx2)}
.entre{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}

/* hero */
.hero{background:linear-gradient(135deg,var(--acfr),var(--sup) 62%);
  border:1px solid var(--linha2);border-radius:var(--r);padding:26px 28px;margin-bottom:12px;
  position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;
  border-radius:50%;background:radial-gradient(circle,var(--ac) 0%,transparent 68%);opacity:.09}
.hero .rot{margin:0 0 10px}
.hero h2{font-size:25px;margin-bottom:8px}
.hero p{margin:0;color:var(--tx2);max-width:62ch}
.acao{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:10px 16px;
  background:var(--ac);color:#06120d;border:0;border-radius:var(--r2);font-weight:640;
  font-size:13.5px;cursor:pointer}
.acao:hover{background:var(--ac2)}
.acao.fantasma{background:none;color:var(--tx);border:1px solid var(--linha2)}
.acao.fantasma:hover{background:var(--sup2);border-color:var(--tx3)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;
  margin-bottom:12px}
.tile{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r2);
  padding:15px 17px;border-top:2px solid var(--cinza)}
.tile.v{border-top-color:var(--verde)} .tile.a{border-top-color:var(--amb)}
.tile.r{border-top-color:var(--verm)}
.tile b{display:block;font-size:26px;font-weight:680;letter-spacing:-.03em;line-height:1.1}
.tile span{font-size:12px;color:var(--tx2)}

/* conceito */
.conc{background:var(--sup);border:1px solid var(--linha);border-left:3px solid var(--cinza);
  border-radius:var(--r2);padding:13px 16px}
.conc.d3{border-left-color:var(--verde)} .conc.d2{border-left-color:var(--amb)}
.conc.d1{border-left-color:var(--verm)}
.conc b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.conc .meta{margin-top:3px;display:block;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{font-size:11.5px;padding:2.5px 9px;border-radius:99px;border:1px solid var(--linha2);
  color:var(--tx2);white-space:nowrap}
.chip.al{border-color:var(--verm);color:var(--verm)}
.chip.ok{border-color:var(--ac2);color:var(--ac)}
.err{font-size:12.5px;color:var(--verm);margin-top:7px;display:flex;gap:6px;align-items:flex-start}
.err svg{margin-top:3px;flex:none}

/* trilha */
.mod{margin-bottom:26px}
.modt{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.modt h3{margin:0}
.modn{font-size:11.5px;color:var(--tx2);background:var(--sup2);border:1px solid var(--linha);
  padding:2px 9px;border-radius:99px;white-space:nowrap}
.modl{flex:1;height:1px;background:var(--linha)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:10px}

/* flashcard */
.baralho{max-width:620px;margin:0 auto}
.carta{background:var(--sup);border:1px solid var(--linha);border-radius:var(--r);
  padding:46px 32px;min-height:250px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;box-shadow:var(--sombra);cursor:pointer;
  user-select:none;transition:border-color .15s}
.carta:hover{border-color:var(--linha2)}
.carta.virada{border-color:var(--ac2);background:linear-gradient(180deg,var(--acfr),var(--sup) 55%)}
.carta .lado{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);
  margin-bottom:16px;font-weight:650}
.carta .txt{font-size:21px;line-height:1.42;max-width:46ch;letter-spacing:-.01em}
.carta .dica{font-size:12px;color:var(--tx3);margin-top:24px;display:flex;align-items:center;gap:6px}
.acoes{display:flex;gap:10px;margin-top:13px}
.bt{flex:1;padding:12px 16px;border-radius:var(--r2);border:1px solid var(--linha2);
  background:var(--sup);cursor:pointer;font-size:14px;font-weight:620;
  display:flex;align-items:center;justify-content:center;gap:8px}
.bt:hover{border-color:var(--tx3)}
.bt.ok{border-color:var(--ac2);color:var(--ac)} .bt.ok:hover{background:var(--acfr)}
.bt.nao{border-color:var(--verm);color:var(--verm)}
.passo{margin-top:16px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--tx3)}
.passo .tr{flex:1;height:3px;border-radius:99px;background:var(--linha2);overflow:hidden}
.passo .tr i{display:block;height:100%;background:var(--ac)}

/* copiar */
.saida{background:var(--acfr);border:1px solid var(--ac2);border-radius:var(--r);
  padding:17px 19px;margin-top:14px}
.saida b{display:block;margin-bottom:4px}
.saida .meta{margin-bottom:10px}
.saida code{display:block;background:var(--bg);border:1px solid var(--linha2);border-radius:8px;
  padding:12px 14px;margin-bottom:11px;font:13px/1.55 var(--mono);white-space:pre-wrap;
  word-break:break-word}

/* material */
.itens{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:10px}
.item{display:flex;gap:13px;align-items:flex-start;text-align:left;background:var(--sup);
  border:1px solid var(--linha);border-radius:var(--r2);padding:16px 17px;cursor:pointer;
  width:100%}
.item:hover{border-color:var(--linha2);background:var(--sup2)}
.item .ic{width:34px;height:34px;border-radius:9px;background:var(--acfr);color:var(--ac);
  display:flex;align-items:center;justify-content:center;flex:none}
.item b{display:block;font-size:14px;font-weight:620;line-height:1.35;margin-bottom:2px}
/* leitura: a coluna estreita é o CARTÃO, não o texto dentro de um cartão largo.
   Cartão largo com texto estreito é o que deixa metade da tela vazia. */
.card.leitor{max-width:820px;margin:0 auto 12px;padding:34px 44px}
.leitura{font-size:15.5px;line-height:1.72}
.leitura hr{border:0;border-top:1px solid var(--linha);margin:26px 0}
.leitura ol{margin:0 0 14px;padding-left:22px}
.leitura em{font-style:italic;color:var(--tx2)}
.leitura h4{font-size:16px;margin:26px 0 8px;font-weight:640;letter-spacing:-.01em}
.leitura h4:first-child{margin-top:0}
.leitura p{margin:0 0 14px}
.leitura ul{margin:0 0 14px;padding-left:20px}
.leitura li{margin-bottom:6px}
.leitura code{background:var(--sup2);border:1px solid var(--linha);padding:1px 6px;
  border-radius:5px;font:13px var(--mono)}
.leitura strong{font-weight:650;color:var(--tx)}
.ev{font-size:10.5px;padding:1.5px 7px;border-radius:5px;border:1px solid var(--linha2);
  color:var(--tx2);white-space:nowrap;letter-spacing:.02em;vertical-align:1px}

/* fontes */
.fonte{background:var(--sup);border:1px solid var(--linha);border-left:3px solid var(--verde);
  border-radius:var(--r2);padding:15px 17px;margin-bottom:9px}
.fonte.nv{border-left-color:var(--amb)}
.fonte b{display:block;font-size:14.5px;font-weight:620;margin-bottom:4px;line-height:1.35}
.fonte a{color:var(--ac);word-break:break-all;font-size:12.5px;text-decoration:none}
.fonte a:hover{text-decoration:underline}
.niv{font-size:11px;font-weight:700;background:var(--acfr);color:var(--ac);padding:2px 8px;
  border-radius:99px;white-space:nowrap}
.niv.b{background:var(--sup2);color:var(--tx2)}

/* ---------- mapa mental ---------- */
.mapa{position:relative;overflow-x:auto;padding:6px 2px 10px}
.mapa .tela{position:relative;margin:0 auto}
.mapa svg.fios{position:absolute;inset:0;pointer-events:none;overflow:visible}
.mapa .fio{fill:none;stroke:var(--linha2);stroke-width:1.5}
.mapa .fio.v{stroke:var(--verde)} .mapa .fio.a{stroke:var(--amb)}
.mapa .fio.r{stroke:var(--verm)}
.no{position:absolute;transform:translateY(-50%);border-radius:var(--r2);
  border:1px solid var(--linha);background:var(--sup);padding:9px 13px;cursor:pointer;
  text-align:left;line-height:1.3;box-shadow:var(--sombra);transition:border-color .12s,transform .12s}
.no:hover{border-color:var(--tx3);transform:translateY(-50%) translateX(2px)}
.no b{display:block;font-size:13px;font-weight:600;letter-spacing:-.005em}
.no .s{font-size:11px;color:var(--tx2)}
.no.raiz{background:linear-gradient(135deg,var(--acfr),var(--sup));border-color:var(--ac2);
  cursor:default}
.no.raiz:hover{transform:translateY(-50%)}
.no.raiz b{font-size:14.5px}
.no.mod{background:var(--sup2);border-color:var(--linha2)}
.no.mod .cnt{font-size:11px;color:var(--tx3);margin-left:6px}
.no.cnc{border-left:3px solid var(--cinza)}
.no.cnc.d3{border-left-color:var(--verde)} .no.cnc.d2{border-left-color:var(--amb)}
.no.cnc.d1{border-left-color:var(--verm)}
.no.sel{border-color:var(--ac);box-shadow:0 0 0 3px var(--acfr),var(--sombra)}
.no .mat{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;color:var(--ac);
  margin-top:3px}
.det{position:sticky;bottom:0;margin-top:14px}
.det .card{margin-bottom:0;border-color:var(--ac2)}
.det .lig{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.det .lig button{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;
  border-radius:var(--r2);border:1px solid var(--linha2);background:var(--sup2);cursor:pointer;
  font-size:13px;font-weight:600}
.det .lig button:hover{border-color:var(--ac2);color:var(--ac)}
.det .fechar{background:none;border:0;color:var(--tx3);cursor:pointer;padding:4px;display:flex}
.det .fechar:hover{color:var(--tx)}
.legenda{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--tx2);margin-bottom:12px}
.legenda span{display:flex;align-items:center;gap:6px}

/* busca: resultados */
.res{margin-bottom:9px}
.res .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);
  font-weight:650}
mark{background:var(--acfr);color:var(--ac);border-radius:3px;padding:0 2px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--linha)}
  nav{display:flex;overflow-x:auto;padding:8px;gap:2px}
  .nav{width:auto;white-space:nowrap;margin:0}
  .anel,.assunto{display:block}
  .palco,.topo{padding-left:18px;padding-right:18px}
  .busca{max-width:none}
  .kbd{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="marca">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ac)">
        <path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z"/><path d="M3 12l9 4.5 9-4.5"/>
        <path d="M3 16.5 12 21l9-4.5"/></svg>
      <div><div class="nome">Fábrica de Estudos</div><div class="sub">Study Machine</div></div>
    </div>
    <div class="assunto">
      <div class="rot" id="rotA">Assunto</div>
      <h1 id="titulo"></h1>
      <p id="objetivo"></p>
    </div>
    <div class="anel">
      <div class="anelb"><b id="pct">0%</b><span id="conta"></span></div>
      <div class="trilho" id="trilho"></div>
      <div class="mini" id="mini"></div>
    </div>
    <nav id="nav"></nav>
    <div class="rodape">
      <span id="rodape"></span>
      <button onclick="tema()" title="Alternar tema" aria-label="Alternar tema">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </aside>
  <main>
    <div class="topo"><div class="topoin">
      <div class="busca">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar conceito, aula, fonte..." autocomplete="off">
      </div>
      <span class="kbd">Ctrl K</span>
      <span class="data" id="hoje"></span>
    </div></div>
    <div class="palco" id="palco"></div>
  </main>
</div>

<script>
var D = window.DADOS || null;
var NIV = {"\u{1F7E2}":3,"\u{1F7E1}":2,"\u{1F534}":1,"\u26AA":0};
var COR = {3:"var(--verde)",2:"var(--amb)",1:"var(--verm)",0:"var(--cinza)"};
var NOME = {3:"dominado",2:"parcial",1:"não compreendido",0:"não estudado"};
var CLS  = {3:"v",2:"a",1:"r",0:""};
var hoje = new Date().toISOString().slice(0,10);

var IC = {
  hoje:'<path d="M3 9h18M7 3v3m10-3v3"/><rect x="3" y="5" width="18" height="16" rx="2"/>',

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c] }) }

/* markdown minimo.
   O arquivo vem com quebra dura de linha em ~95 colunas. Parágrafo é separado por linha
   EM BRANCO, nunca por quebra de linha: sem isso cada linha vira um <p> e o negrito que
   atravessa a quebra aparece como ** na tela. */
function md(t,semTitulo){
  if(!t) return "";
  var L=String(t).replace(/\r/g,"").split("\n"), out=[], buf=[], lista=null, primeiro=true;
  /* o rótulo de evidência vem PRIMEIRO, e come as crases em volta se houver.
     Se `código` rodasse antes, `[estabelecido]` sairia como <code> com um <span> dentro. */
  function inl(s){ return esc(s)
    .replace(/`?\[(estabelecido|evidência forte|evidência limitada|hipótese|interpretação|opinião|controverso|desatualizado)\]`?/g,'<span class="ev">$1</span>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+?)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+?)\*(?=[\s).,;:!?]|$)/g,"$1<em>$2</em>") }
  function fecha(){
    if(buf.length){ out.push("<p>"+inl(buf.join(" "))+"</p>"); buf=[] }
    if(lista){ out.push(lista==="ol"?"</ol>":"</ul>"); lista=null }
  }
  for(var k=0;k<L.length;k++){
    var l=L[k], t2=l.trim();
    if(!t2){ fecha(); continue }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t2)){ fecha(); out.push("<hr>"); continue }
    var h=t2.match(/^(#{1,6})\s+(.*)/);
    if(h){
      fecha();
      /* a aula às vezes repete o próprio título como primeiro cabeçalho */
      if(primeiro && semTitulo && slug(h[2])===slug(semTitulo)){ primeiro=false; continue }
      primeiro=false;
      out.push("<h4>"+inl(h[2])+"</h4>"); continue;
    }
    var ul=t2.match(/^[-*]\s+(.*)/), ol=t2.match(/^\d+[.)]\s+(.*)/);
    if(ul||ol){
      if(buf.length){ out.push("<p>"+inl(buf.join(" "))+"</p>"); buf=[] }
      var tipo=ul?"ul":"ol";
      if(lista&&lista!==tipo){ out.push(lista==="ol"?"</ol>":"</ul>"); lista=null }
      if(!lista){ out.push(tipo==="ol"?"<ol>":"<ul>"); lista=tipo }
      out.push("<li>"+inl((ul||ol)[1])+"</li>"); continue;
    }
    if(lista){ out.push(lista==="ol"?"</ol>":"</ul>"); lista=null }
    primeiro=false;
    buf.push(t2);
  }
  fecha();
  return out.join("");
}

  '<div><b>'+esc(titulo)+'</b>'+esc(texto)+'</div></div>' }

/* ---------- HOJE ---------- */
function abaHoje(){
  var v=vencidos(), fr=fracos(), lib=liberados(), tot=cs().length;
  var d3=cs().filter(function(c){return niv(c)===3}).length;
  var h="";

  /* hero: a proposta do dia */
  var tit, txt, cmd;
  if(v.length){
    tit = v.length===1 ? "1 conceito pede revisão" : v.length+" conceitos pedem revisão";
    txt = "Começar por aqui rende mais que conteúdo novo: são coisas que você já viu e que estão "+
          "no ponto de escapar." + (v[0].erro&&v[0].erro!=="-" ? " A primeira é "+v[0].nome+
          ", que já te pegou antes." : "");
    cmd = "vamos revisar";
  } else if(lib.length){
    tit = lib[0].nome;
    txt = "Nada vence hoje, então dá para avançar. Esse é o próximo da trilha e os pré-requisitos "+
          "dele já estão firmes.";
    cmd = "me ensina "+lib[0].nome;
  } else if(tot===0){
    tit = "Nenhum assunto montado ainda";
    txt = "Abra o Claude Code nesta pasta e diga o que você quer aprender.";
    cmd = "abrir";
  } else {
    tit = "Tudo em dia";
    txt = "Nada vencido e nada liberado no momento. Peça ao Claude para seguir a trilha, que ele "+
          "acha o melhor próximo passo.";
    cmd = "o que estudo agora?";
  }
  h += '<div class="hero">'+rot("hoje","Seu plano de hoje")+
       '<h2>'+esc(tit)+'</h2><p>'+esc(txt)+'</p>'+
       '<button class="acao" onclick="copiaTxt(this,\''+esc(cmd).replace(/'/g,"\\'")+'\')">'+
       ic("copia",15)+'copiar "'+esc(cmd)+'"</button></div>';

  /* tiles */
  var por=[3,2,1,0].map(function(k){ return [cs().filter(function(c){return niv(c)===k}).length,k] });
  h += '<div class="tiles">'+por.map(function(p){
    return '<div class="tile '+CLS[p[1]]+'"><b>'+p[0]+'</b><span>'+NOME[p[1]]+'</span></div>' }).join("")+
    '</div>';

  /* revisar */
  h += rot("rel","Revisar hoje");
  if(v.length){
    h += v.slice(0,10).map(function(c){
      var dep=dependentes(c.id).length;
      return '<div class="card"><div class="entre"><div style="min-width:0">'+
        '<h3>'+esc(c.nome)+'</h3>'+
        '<span class="meta">'+esc(c.dominio)+" "+NOME[niv(c)]+" · confiança "+(c.conf||0)+
        (dep?" · "+dep+" conceito"+(dep>1?"s dependem":" depende")+" dele":"")+'</span>'+
        (c.erro&&c.erro!=="-" ? '<div class="err">'+ic("alerta",14)+'<span>'+esc(c.erro)+'</span></div>':"")+
        '</div><span class="chip">venceu '+esc(dia(c.proxima))+'</span></div></div>' }).join("");
    if(v.length>10) h += '<div class="meta" style="margin:8px 2px">Mais '+(v.length-10)+
      ' na fila. O Claude pega as 10 mais urgentes por sessão, de propósito.</div>';
  } else {
    h += vazio("check","Nada vence hoje.",
      tot? "As datas de revisão aparecem aqui conforme você vai sendo testada nos conceitos."
         : "Comece um assunto para a trilha existir.");
  }

  /* proximo */
  if(lib.length){
    h += rot("seta","Liberado para estudar");
    h += '<div class="grade">'+lib.slice(0,6).map(function(c){
      return '<div class="conc"><b>'+esc(c.nome)+'</b>'+
        '<span class="meta">módulo '+esc(c.modulo)+'</span>'+
        '<div class="chips"><span class="chip ok">pré-requisitos prontos</span></div></div>' }).join("")+
      '</div>';
  }

  /* fracos */
  if(fr.length){
    h += rot("fogo","O que está fraco");
    h += '<div class="grade">'+fr.slice(0,6).map(function(c){
      return '<div class="conc d'+niv(c)+'"><b>'+esc(c.nome)+'</b>'+
        '<span class="meta">'+NOME[niv(c)]+" · confiança "+(c.conf||0)+'</span>'+
        (c.erro&&c.erro!=="-" ? '<div class="err">'+ic("alerta",14)+'<span>'+esc(c.erro)+'</span></div>':"")+
        '</div>' }).join("")+'</div>';
  }

  /* honestidade quando tudo esta branco */
  if(tot && d3===0 && !fr.length){
    h += rot("alerta","Por que está tudo cinza");
    h += '<div class="card calma"><p style="margin:0;color:var(--tx2);max-width:66ch">'+
      'Nenhum conceito foi medido ainda. Isso não quer dizer que você não sabe nada, quer dizer '+
      'que o sistema não tem prova. Ele só move um conceito depois que você explica, resolve ou '+
      'compara alguma coisa. Peça <b style="color:var(--tx)">me testa</b> ou vá na aba Estudar '+
      'para o grafo começar a sair do branco.</p></div>';
  }

  /* ultima sessao */
  var s=(D.sessoes||[])[0];
  if(s){
    h += rot("livro","Última sessão");
    h += '<div class="card"><div class="entre"><h3>'+esc(dia(s.data))+'</h3>'+
      '<span class="meta">'+esc(s.duracao||"")+'</span></div>'+
      '<div class="leitura" style="font-size:14.5px;margin-top:8px">'+md(s.resumo)+'</div></div>';
  }
  return h;
}

  var mods=(D.modulos&&D.modulos.length)?D.modulos:(function(){

      r.push({id:c.modulo,nome:c.modulo})} }); return r })();
  var h='<div class="card calma"><div class="entre"><div>'+
    '<h3>Como ler</h3><span class="meta">A cor da borda é o quanto você domina. '+
    'Chip vermelho é <b>lacuna</b>: conceito que você ainda não domina e de que este aqui '+

  mods.forEach(function(m){

var selMapa=null, fechado={};

/* aula que cobre o conceito: por id declarado, por título igual, senão nada */
function aulaDe(c){
  var A=aulas(), n=String(c.nome).toLowerCase();
  for(var k=0;k<A.length;k++) if((A[k].conceitos||[]).indexOf(c.id)>=0) return k;
  for(k=0;k<A.length;k++) if(String(A[k].titulo).toLowerCase()===n) return k;
  return -1;
}
function aulasDoModulo(id){
  var r=[]; aulas().forEach(function(x,k){ if(x.modulo && slug(x.modulo)===slug(id)) r.push(k) });
  return r;
}
function slug(s){ return String(s||"").toLowerCase()
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") }
function flashDe(c){
  var n=String(c.nome).toLowerCase();
  return ((D&&D.flashcards)||[]).filter(function(f){
    return String(f.conceito||"").toLowerCase().indexOf(n)>=0 ||
           n.indexOf(String(f.conceito||"").toLowerCase())>=0 && f.conceito });

/* primeiro parágrafo de verdade da aula, para o resumo do nó */
function resumoDe(c){
  var k=aulaDe(c); if(k<0) return "";
  var L=String(aulas()[k].conteudo||"").replace(/\r/g,"").split("\n"), buf=[];
  for(var j=0;j<L.length;j++){
    var l=L[j].trim();
    /* o texto vem com quebra dura: junta até a linha em branco, senão sai meia frase */
    if(!l||/^(#|[-*]\s|\d+[.)]\s|-{3,})/.test(l)){ if(buf.length) break; continue }
    buf.push(l);
  }
  if(!buf.length) return "";
  var p=buf.join(" ").replace(/\*\*/g,"").replace(/`/g,"").replace(/\[[^\]]*\]\([^)]*\)/g,"")
          .replace(/\[[^\]]*\]/g,"").replace(/\s+/g," ").trim();
  return p.length>210 ? p.slice(0,210).replace(/\s\S*$/,"")+"…" : p;
}

function abaMapa(){
  if(!cs().length) return vazio("vazio","Nenhum conceito ainda.",
    "O mapa nasce junto com a trilha, quando você começa um assunto com o Claude.");
  return '<div id="mapa"></div>';
}

function pintaMapa(){
  var alvo=document.getElementById("mapa"); if(!alvo) return;
  var lista=cs();
  var mods=(D.modulos&&D.modulos.length)?D.modulos:(function(){
    var vis={},r=[]; lista.forEach(function(c){ if(!vis[c.modulo]){vis[c.modulo]=1;
      r.push({id:c.modulo,nome:c.modulo})} }); return r })();

  var ROW=44, GAP=24, XR=0, WR=176, XM=236, WM=184, XC=460, WC=272, W=XC+WC;
  var nos=[], fios=[], y=18;
  var comMaterial=0;

  mods.forEach(function(m){
    var L=lista.filter(function(c){ return c.modulo===m.id });
    if(!L.length) return;
    var col=!!fechado[m.id];
    var ini=y, ys=[];
    if(col){ y+=ROW*0.6 }
    else L.forEach(function(c,i){ ys.push(y+i*ROW+ROW/2); });
    var ym = col ? ini+ROW*0.3 : (ys[0]+ys[ys.length-1])/2;
    var ok=L.filter(function(c){ return niv(c)===3 }).length;

    nos.push('<button class="no mod" style="left:'+XM+'px;top:'+ym+'px;width:'+WM+'px" '+
      'onclick="dobra(\''+esc(m.id)+'\')"><b>'+esc(m.nome)+
      '<span class="cnt">'+(col?"▸":"▾")+'</span></b>'+
      '<span class="s">'+ok+" de "+L.length+' dominados</span></button>');
    fios.push({x1:XR+WR,y1:0,x2:XM,y2:ym,cls:""});

    if(!col) L.forEach(function(c,i){
      var yc=ys[i], n=niv(c), k=aulaDe(c), fl=flashDe(c).length;
      if(k>=0) comMaterial++;
      var marca = k>=0 ? '<span class="mat">'+ic("livro",11)+'aula</span>'
                : (fl ? '<span class="mat">'+ic("estudar",11)+fl+' cartas</span>' : "");
      nos.push('<button class="no cnc d'+n+(selMapa===c.id?" sel":"")+'" '+
        'style="left:'+XC+'px;top:'+yc+'px;width:'+WC+'px" onclick="pico(\''+c.id+'\')">'+
        '<b>'+esc(c.dominio)+" "+esc(c.nome)+'</b>'+
        '<span class="s">'+NOME[n]+'</span>'+marca+'</button>');
      fios.push({x1:XM+WM,y1:ym,x2:XC,y2:yc,cls:["","r","a","v"][n]});
    });
    y = (col?ini+ROW*0.6:y+L.length*ROW) + GAP;
  });

  var H=Math.max(y,120), yr=H/2;
  fios.forEach(function(f){ if(f.y1===0) f.y1=yr });

  var svg='<svg class="fios" width="'+W+'" height="'+H+'">'+fios.map(function(f){
    var mx=(f.x1+f.x2)/2;
    return '<path class="fio '+f.cls+'" d="M'+f.x1+' '+f.y1+' C'+mx+' '+f.y1+' '+mx+' '+f.y2+
           ' '+f.x2+' '+f.y2+'"/>' }).join("")+'</svg>';

  var raiz='<div class="no raiz" style="left:'+XR+'px;top:'+yr+'px;width:'+WR+'px">'+
    '<b>'+esc(D.assunto||"Assunto")+'</b><span class="s">'+mods.length+" módulos · "+
    lista.length+' conceitos</span></div>';

  alvo.innerHTML =
    '<div class="legenda">'+[3,2,1,0].map(function(k){
      return '<span><i class="pt" style="background:'+COR[k]+'"></i>'+NOME[k]+'</span>' }).join("")+
      '<span style="color:var(--tx3)">clique no módulo para recolher, no conceito para abrir</span>'+
    '</div>'+
    '<div class="card calma" style="padding:15px 18px"><span class="meta">'+
      comMaterial+" de "+lista.length+" conceitos já têm aula escrita"+
      (comMaterial<lista.length ? ". Os outros existem no mapa mas ainda não foram estudados." : ".")+
    '</span></div>'+
    '<div class="mapa"><div class="tela" style="width:'+W+'px;height:'+H+'px">'+svg+raiz+
      nos.join("")+'</div></div>'+
    '<div class="det" id="det"></div>';
  pintaDetalhe();
}

function dobra(id){ fechado[id]=!fechado[id]; pintaMapa() }

function pico(id){ selMapa = (selMapa===id ? null : id); pintaMapa();
  var d=document.getElementById("det"); if(d&&selMapa) d.scrollIntoView({block:"nearest",behavior:"smooth"}) }

function pintaDetalhe(){
  var d=document.getElementById("det"); if(!d) return;
  if(!selMapa){ d.innerHTML=""; return }
  var c=acha(selMapa); if(!c){ d.innerHTML=""; return }
  var k=aulaDe(c), fl=flashDe(c), res=resumoDe(c);
  var falta=(c.prereq||[]).map(acha).filter(function(q){ return q && niv(q)<3 });
  var pre=(c.prereq||[]).map(acha).filter(Boolean);
  var dep=dependentes(c.id);

  var lig="";
  if(k>=0) lig+='<button onclick="doMapaAula('+k+')">'+ic("livro",15)+
    "ler a aula: "+esc(aulas()[k].titulo)+'</button>';
  if(fl.length) lig+='<button onclick="doMapaFlash(\''+esc(c.id)+'\')">'+ic("estudar",15)+
    "treinar "+fl.length+" carta"+(fl.length>1?"s":"")+'</button>';
  var doMod=aulasDoModulo(c.modulo).filter(function(x){ return x!==k });
  if(k<0 && doMod.length) lig+='<button onclick="doMapaAula('+doMod[0]+')">'+ic("livro",15)+
    "aula do módulo: "+esc(aulas()[doMod[0]].titulo)+'</button>';
  pre.forEach(function(q){ lig+='<button onclick="pico(\''+q.id+'\')">'+ic("seta",15)+
    "vem antes: "+esc(q.nome)+'</button>' });

  d.innerHTML='<div class="card"><div class="entre"><div style="min-width:0">'+
    '<div class="rot" style="margin:0 0 7px">'+ic("mapa",13)+esc(c.modulo)+'</div>'+
    '<h2 style="font-size:21px">'+esc(c.dominio)+" "+esc(c.nome)+'</h2>'+
    '<span class="meta">'+NOME[niv(c)]+" · confiança "+(c.conf||0)+
      (c.proxima?" · volta em "+esc(dia(c.proxima)):"")+
      (dep.length?" · "+dep.length+" conceito"+(dep.length>1?"s dependem":" depende")+" dele":"")+
    '</span></div><button class="fechar" onclick="pico(null)" aria-label="Fechar">'+ic("x",17)+
    '</button></div>'+
    (res?'<p style="margin:13px 0 0;color:var(--tx2);max-width:68ch">'+esc(res)+'</p>':"")+
    (falta.length?'<div class="err" style="margin-top:12px">'+ic("alerta",15)+
      '<span>Lacuna: '+falta.map(function(q){return esc(q.nome)}).join(", ")+
      (falta.length>1?". Eles vêm antes.":". Ele vem antes.")+'</span></div>':"")+
    (c.erro&&c.erro!=="-"?'<div class="err" style="margin-top:10px">'+ic("alerta",15)+
      '<span>'+esc(c.erro)+'</span></div>':"")+
    (lig?'<div class="lig">'+lig+'</div>':
      '<div class="saida" style="margin-top:14px"><b>Ainda não tem material</b>'+
      '<code>me ensina '+esc(c.nome)+'</code>'+
      '<button class="bt" style="flex:none;padding:8px 14px" onclick="copiaTxt(this,\'me ensina '+
      esc(c.nome).replace(/'/g,"\\'")+'\')">'+ic("copia",14)+'copiar</button></div>')+
    '</div>';
}

function doMapaAula(k){ ir("material"); abrir(k) }
function doMapaFlash(id){ filtroFlash=id; ir("estudar") }

/* ---------- BUSCA ---------- */
function buscar(t){
  t=t.trim().toLowerCase();
  if(t.length<2){ ir(atual); return }
  function marcar(s){ var k=String(s).toLowerCase().indexOf(t);
    return k<0?esc(s):esc(String(s).slice(0,k))+"<mark>"+esc(String(s).substr(k,t.length))+"</mark>"+
      esc(String(s).slice(k+t.length)) }
  var h="", n=0;
  var cc=cs().filter(function(c){ return (c.nome+" "+(c.erro||"")).toLowerCase().indexOf(t)>=0 });
  if(cc.length){ n+=cc.length; h+=rot("trilha","Conceitos")+'<div class="grade">'+cc.map(function(c){
    return '<div class="conc d'+niv(c)+'"><b>'+esc(c.dominio)+" "+marcar(c.nome)+'</b>'+
      '<span class="meta">'+esc(c.modulo)+" · "+NOME[niv(c)]+'</span></div>' }).join("")+'</div>' }
  var aa=((D&&D.aulas)||[]).filter(function(x){
    return (x.titulo+" "+x.conteudo).toLowerCase().indexOf(t)>=0 });
  if(aa.length){ n+=aa.length; h+=rot("material","Aulas")+'<div class="itens">'+aa.map(function(x){
    var k=((D&&D.aulas)||[]).indexOf(x);
    return '<button class="item" onclick="limpaBusca();ir(\'material\');abrir('+k+')">'+
      '<span class="ic">'+ic("livro",17)+'</span><span style="min-width:0"><b>'+marcar(x.titulo)+'</b>'+
      '<span class="meta">'+esc(x.modulo||"")+'</span></span></button>' }).join("")+'</div>' }
  var ff=((D&&D.fontes&&D.fontes.verificadas)||[]).filter(function(s){
    return (s.titulo+" "+(s.autor||"")).toLowerCase().indexOf(t)>=0 });
  if(ff.length){ n+=ff.length; h+=rot("fontes","Fontes")+ff.map(function(s){
    return '<div class="fonte"><b>'+marcar(s.titulo)+'</b><div class="meta">'+esc(s.autor||"")+'</div></div>'
    }).join("") }
  var bb=((D&&D.flashcards)||[]).filter(function(c){
    return (c.frente+" "+c.verso).toLowerCase().indexOf(t)>=0 });
  if(bb.length){ n+=bb.length; h+=rot("estudar","Flashcards")+bb.map(function(c){
    return '<div class="card"><b>'+marcar(c.frente)+'</b><div class="meta" style="margin-top:4px">'+
      esc(c.verso)+'</div></div>' }).join("") }
  document.getElementById("palco").innerHTML = n ? h :
    vazio("vazio","Nada encontrado para \u201C"+t+"\u201D.","Tente outra palavra.");
}
function limpaBusca(){ var q=document.getElementById("q"); q.value=""; }

/* ---------- copiar ---------- */
function copiaTxt(bt,t){
  var antigo=bt.innerHTML;
  function fim(ok){ bt.innerHTML=ok?ic("check",14)+"copiado":"selecione e copie";
    setTimeout(function(){ bt.innerHTML=antigo },1800) }
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(function(){fim(1)},function(){fim(0)});
  else fim(0);
}
function copiaEl(bt){
  var el=document.getElementById("res");
  if(navigator.clipboard&&navigator.clipboard.writeText){
    copiaTxt(bt, el.textContent); return;
  }
  var r=document.createRange(); r.selectNode(el);
  window.getSelection().removeAllRanges(); window.getSelection().addRange(r);
  bt.innerHTML="selecionado, use Ctrl+C";
}

/* ---------- montagem ---------- */
var ABAS=[
  {id:"hoje",     nome:"Hoje",         ic:"hoje",     fn:abaHoje,     n:function(){return vencidos().length}},
  {id:"mapa",     nome:"Mapa mental",  ic:"mapa",     fn:abaMapa},
  {id:"trilha",   nome:"Trilha",       ic:"trilha",   fn:abaTrilha},
  {id:"estudar",  nome:"Estudar",      ic:"estudar",  fn:abaEstudar,  n:function(){return ((D&&D.flashcards)||[]).length}},
  {id:"material", nome:"Material",     ic:"material", fn:abaMaterial, n:function(){return ((D&&D.aulas)||[]).length}},
  {id:"fontes",   nome:"Fontes",       ic:"fontes",   fn:abaFontes}
];
var atual="hoje";
function ir(id){
  var a=ABAS.filter(function(x){return x.id===id})[0]; if(!a) return;
  atual=id;
  document.getElementById("palco").innerHTML=a.fn();
  var bs=document.querySelectorAll(".nav");
  for(var k=0;k<bs.length;k++) bs[k].setAttribute("aria-selected", bs[k].dataset.id===id);
  if(id==="estudar") carta();
  if(id==="mapa") pintaMapa();
  try{ localStorage.setItem("sm.aba",id) }catch(e){}
  if(id!=="material") window.scrollTo({top:0});
}
function tema(){
  var r=document.documentElement;
  var claro = getComputedStyle(r).getPropertyValue("--bg").trim().indexOf("#f")===0;
  r.dataset.tema = claro ? "escuro" : "claro";
  try{ localStorage.setItem("sm.tema",r.dataset.tema) }catch(e){}
}
function inicia(){
  try{ var t=localStorage.getItem("sm.tema"); if(t) document.documentElement.dataset.tema=t }catch(e){}
  document.getElementById("hoje").textContent =
    new Date().toLocaleDateString("pt-BR",{day:"numeric",month:"long"});

  if(!D){
    document.getElementById("titulo").textContent="Sem dados";
    document.getElementById("objetivo").textContent="dados.js não foi encontrado.";
    document.getElementById("palco").innerHTML=vazio("alerta","O arquivo dados.js não está aqui.",
      "Ele precisa ficar na mesma pasta deste painel. Peça ao Claude: atualiza o painel.");
    return;
  }
  document.getElementById("titulo").textContent = D.assunto||"Estudo";
  document.getElementById("objetivo").textContent = D.objetivo||"";
  document.getElementById("rotA").textContent = "Atualizado em "+dia(D.atualizado);
  document.title = (D.assunto||"Estudo")+" · painel";

  var tot=cs().length||1;
  var por=[3,2,1,0].map(function(k){ return [cs().filter(function(c){return niv(c)===k}).length,k] });
  document.getElementById("pct").textContent = Math.round(por[0][0]/tot*100)+"%";
  document.getElementById("conta").textContent = por[0][0]+" de "+cs().length;
  document.getElementById("trilho").innerHTML = por.filter(function(p){return p[0]})
    .map(function(p){ return '<i style="width:'+(p[0]/tot*100)+"%;background:"+COR[p[1]]+'"></i>' }).join("");
  document.getElementById("mini").innerHTML = por.map(function(p){
    return '<div><span class="pt" style="background:'+COR[p[1]]+'"></span>'+NOME[p[1]]+
           '<b style="margin-left:auto">'+p[0]+'</b></div>' }).join("");

  document.getElementById("nav").innerHTML = ABAS.map(function(a){
    var n=a.n?a.n():0;
    return '<button class="nav" data-id="'+a.id+'" onclick="ir(\''+a.id+'\')">'+ic(a.ic)+
      '<span>'+a.nome+'</span>'+(n?'<span class="n">'+n+'</span>':"")+'</button>' }).join("");

  document.getElementById("rodape").textContent =
    ((D.sessoes||[]).length)+" sessões · gerado do grafo";

  var q=document.getElementById("q");
  q.addEventListener("input",function(){ buscar(q.value) });
  document.addEventListener("keydown",function(e){
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); q.focus(); q.select() }
    if(e.key==="Escape"&&document.activeElement===q){ q.value=""; ir(atual); q.blur() }
    if(document.activeElement===q) return;
    if(atual==="estudar"&&bar.length&&i<bar.length){
      if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(!virada) virar() }
      else if(virada&&(e.key==="1"||e.key.toLowerCase()==="e")) marca(0);
      else if(virada&&(e.key==="2"||e.key.toLowerCase()==="a")) marca(1);
    }
  });

  var ini="hoje"; try{ ini=localStorage.getItem("sm.aba")||"hoje" }catch(e){}
  ir(ABAS.some(function(a){return a.id===ini})?ini:"hoje");
}
inicia();
