<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de estudo</title>
<script src="dados.js"></script>
<style>
:root{
  --bg:#f7f6f3; --superficie:#ffffff; --borda:#e3e0d9; --borda-forte:#cfcbc1;
  --texto:#1c1b19; --texto-fraco:#6b6862; --acento:#2f6f4f; --acento-fraco:#e8f1ec;
  --verde:#2f8f5b; --amarelo:#b07d17; --vermelho:#c0392b; --cinza:#a8a49c;
  --sombra:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --r:10px; --fonte:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --bg:#16181a; --superficie:#1e2124; --borda:#2e3236; --borda-forte:#3d4348;
  --texto:#e8e6e3; --texto-fraco:#9a968f; --acento:#6bbd8e; --acento-fraco:#1d2d25;
  --verde:#5cbd85; --amarelo:#d9a441; --vermelho:#e06c5d; --cinza:#6b6862;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}}
:root[data-tema="escuro"]{
  --bg:#16181a; --superficie:#1e2124; --borda:#2e3236; --borda-forte:#3d4348;
  --texto:#e8e6e3; --texto-fraco:#9a968f; --acento:#6bbd8e; --acento-fraco:#1d2d25;
  --verde:#5cbd85; --amarelo:#d9a441; --vermelho:#e06c5d; --cinza:#6b6862;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto);font:15px/1.6 var(--fonte);
  -webkit-font-smoothing:antialiased}
.env{max-width:940px;margin:0 auto;padding:0 20px 80px}

header{padding:32px 0 20px}
.migalha{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-fraco)}
h1{margin:6px 0 4px;font-size:30px;line-height:1.15;letter-spacing:-.02em}
.objetivo{color:var(--texto-fraco);max-width:60ch;margin:0}
.barra{display:flex;height:8px;border-radius:99px;overflow:hidden;margin:20px 0 8px;
  background:var(--borda)}
.barra i{display:block;height:100%}
.legenda{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--texto-fraco)}
.legenda b{color:var(--texto);font-weight:600}
.pt{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;
  vertical-align:middle}

nav{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--borda);
  margin-bottom:24px}
nav .env{padding-bottom:0}
.abas{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;
  font:inherit;font-size:14px;color:var(--texto-fraco);cursor:pointer;white-space:nowrap}
.aba:hover{color:var(--texto)}
.aba[aria-selected="true"]{color:var(--texto);border-bottom-color:var(--acento);font-weight:600}
.selo{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:99px;
  background:var(--acento);color:#fff;font-size:11px;font-weight:700;line-height:18px;
  text-align:center}

.cartao{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--r);
  padding:18px 20px;box-shadow:var(--sombra);margin-bottom:14px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--texto-fraco);
  margin:32px 0 12px;font-weight:600}
h2:first-child{margin-top:0}
h3{font-size:17px;margin:0 0 6px;letter-spacing:-.01em}
.vazio{color:var(--texto-fraco);font-style:italic;padding:6px 0}
.linha{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--borda-forte);
  color:var(--texto-fraco)}
.chip.alerta{border-color:var(--vermelho);color:var(--vermelho)}
.erro{font-size:13px;color:var(--vermelho);margin-top:6px}
.meta{font-size:12px;color:var(--texto-fraco);white-space:nowrap}

.mod{margin-bottom:28px}
.mod h3{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.mod h3 span{font-size:12px;font-weight:400;color:var(--texto-fraco)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
.cnc{background:var(--superficie);border:1px solid var(--borda);border-left:3px solid var(--cinza);
  border-radius:8px;padding:12px 14px}
.cnc.d3{border-left-color:var(--verde)} .cnc.d2{border-left-color:var(--amarelo)}
.cnc.d1{border-left-color:var(--vermelho)} .cnc.d0{border-left-color:var(--cinza)}
.cnc b{display:block;font-weight:600;font-size:14px}
.cnc .meta{white-space:normal;margin-top:4px;display:block}

.carta{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--r);
  padding:40px 28px;min-height:200px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;box-shadow:var(--sombra);
  cursor:pointer;user-select:none}
.carta .rot{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--texto-fraco);
  margin-bottom:14px}
.carta .txt{font-size:20px;line-height:1.4;max-width:44ch}
.carta .dica{font-size:12px;color:var(--texto-fraco);margin-top:22px}
.acoes{display:flex;gap:10px;margin-top:14px}
button.bt{flex:1;padding:11px 16px;border-radius:8px;border:1px solid var(--borda-forte);
  background:var(--superficie);color:var(--texto);font:inherit;font-size:14px;font-weight:600;
  cursor:pointer}
button.bt:hover{border-color:var(--texto-fraco)}
button.bt.ok{border-color:var(--verde);color:var(--verde)}
button.bt.nao{border-color:var(--vermelho);color:var(--vermelho)}
button.bt.forte{background:var(--acento);border-color:var(--acento);color:#fff;flex:none;
  padding:9px 18px}
.passo{text-align:center;font-size:13px;color:var(--texto-fraco);margin-top:14px}
.saida{background:var(--acento-fraco);border:1px solid var(--acento);border-radius:8px;
  padding:14px 16px;margin-top:16px;font-size:14px}
.saida code{display:block;background:var(--superficie);border:1px solid var(--borda);
  border-radius:6px;padding:10px 12px;margin:10px 0;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}

.item{display:block;width:100%;text-align:left;background:var(--superficie);
  border:1px solid var(--borda);border-radius:8px;padding:13px 16px;margin-bottom:8px;
  font:inherit;color:var(--texto);cursor:pointer}
.item:hover{border-color:var(--borda-forte)}
.item b{display:block;font-size:14px}
.leitura{max-width:64ch}
.leitura h4{font-size:15px;margin:22px 0 6px}
.leitura p{margin:0 0 12px}
.leitura ul,.leitura ol{margin:0 0 12px;padding-left:20px}
.leitura li{margin-bottom:4px}
.leitura code{background:var(--acento-fraco);padding:1px 5px;border-radius:4px;font-size:13px;
  font-family:ui-monospace,Consolas,monospace}
.ev{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--borda-forte);
  color:var(--texto-fraco);white-space:nowrap}

.fonte{border-left:3px solid var(--verde);padding-left:14px;margin-bottom:18px}
.fonte.nv{border-left-color:var(--amarelo)}
.fonte b{display:block;font-size:14px}
.fonte a{color:var(--acento);word-break:break-all;font-size:13px}

footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--borda);
  font-size:12px;color:var(--texto-fraco);display:flex;justify-content:space-between;gap:14px;
  flex-wrap:wrap}
footer button{background:none;border:0;color:var(--texto-fraco);font:inherit;cursor:pointer;
  text-decoration:underline}
[hidden]{display:none!important}
</style>
</head>
<body>

<nav><div class="env"><div class="abas" id="abas" role="tablist"></div></div></nav>
<div class="env">
  <header>
    <div class="migalha" id="migalha"></div>
    <h1 id="titulo"></h1>
    <p class="objetivo" id="objetivo"></p>
    <div class="barra" id="barra"></div>
    <div class="legenda" id="legenda"></div>
  </header>
  <main id="palco"></main>
  <footer>
    <span id="rodape"></span>
    <button onclick="trocarTema()">alternar tema</button>
  </footer>
</div>

<script>
var D = window.DADOS || null;
var NIV = {"\u{1F7E2}":3,"\u{1F7E1}":2,"\u{1F534}":1,"⚪":0};
var COR = {3:"var(--verde)",2:"var(--amarelo)",1:"var(--vermelho)",0:"var(--cinza)"};
var NOME = {3:"dominado",2:"parcial",1:"nao compreendido",0:"nao estudado"};
var hoje = new Date().toISOString().slice(0,10);

function esc(s){
  return String(s==null?"":s).replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
  });
}
function niv(c){ var n = NIV[c.dominio]; return n===undefined ? 0 : n }
function vencidos(){
  return (D.conceitos||[]).filter(function(c){ return c.proxima && c.proxima <= hoje });
}

/* markdown minimo, sem biblioteca */
function md(t){
  if(!t) return "";
  var linhas = String(t).split("\n"), out = [], lista = false;
  function inline(s){
    return esc(s)
      .replace(/`([^`]+)`/g,"<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
               '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\[(estabelecido|evidência forte|evidência limitada|hipótese|interpretação|opinião|controverso|desatualizado)\]/g,
               '<span class="ev">$1</span>');
  }
  for(var k=0;k<linhas.length;k++){
    var l = linhas[k], li = l.match(/^\s*[-*]\s+(.*)/);
    if(li){ if(!lista){ out.push("<ul>"); lista=true } out.push("<li>"+inline(li[1])+"</li>"); continue }
    if(lista){ out.push("</ul>"); lista=false }
    if(!l.trim()) continue;
    var h = l.match(/^(#{1,6})\s+(.*)/);
    out.push(h ? "<h4>"+inline(h[2])+"</h4>" : "<p>"+inline(l)+"</p>");
  }
  if(lista) out.push("</ul>");
  return out.join("");
}

/* ---------- aba: hoje ---------- */
function abaHoje(){
  var v = vencidos(), cs = D.conceitos||[];
  var fracos = cs.filter(function(c){ return niv(c)>0 && niv(c)<3 })
                 .sort(function(a,b){ return niv(a)-niv(b) || (a.conf||0)-(b.conf||0) })
                 .slice(0,3);
  var prox = cs.filter(function(c){
    return niv(c)===0 && (c.prereq||[]).every(function(p){
      var q = cs.filter(function(x){ return x.id===p })[0];
      return q && niv(q)===3;
    });
  })[0];

  var h = "<h2>Revisar hoje</h2>";
  h += v.length ? v.map(function(c){
    return '<div class="cartao"><div class="linha"><div><h3>'+esc(c.nome)+'</h3>'+
      '<div class="meta">'+esc(c.dominio)+" "+NOME[niv(c)]+" · confiança "+(c.conf||0)+'</div>'+
      (c.erro && c.erro!=="-" ? '<div class="erro">Erro que se repete: '+esc(c.erro)+'</div>' : "")+
      '</div><div class="meta">venceu '+esc(c.proxima)+'</div></div></div>';
  }).join("") : '<div class="cartao vazio">Nada vence hoje. '+
      (prox ? "Dá para avançar no conteúdo novo." : "Aproveite.")+'</div>';

  if(prox) h += '<h2>Próximo conteúdo</h2><div class="cartao"><h3>'+esc(prox.nome)+'</h3>'+
    '<div class="meta">módulo '+esc(prox.modulo)+' · pré-requisitos prontos</div>'+
    '<div class="saida">Peça ao Claude: <code>me ensina '+esc(prox.nome)+'</code></div></div>';

  if(fracos.length) h += "<h2>O que está fraco</h2>"+fracos.map(function(c){
    return '<div class="cartao"><div class="linha"><h3>'+esc(c.nome)+'</h3>'+
      '<div class="meta">confiança '+(c.conf||0)+'</div></div>'+
      (c.erro && c.erro!=="-" ? '<div class="erro">'+esc(c.erro)+'</div>'
                              : '<div class="meta">'+NOME[niv(c)]+'</div>')+'</div>';
  }).join("");

  var s = (D.sessoes||[])[0];
  if(s) h += '<h2>Última sessão</h2><div class="cartao"><div class="linha">'+
    '<h3>'+esc(s.data)+'</h3><div class="meta">'+esc(s.duracao||"")+'</div></div>'+
    '<div class="leitura">'+md(s.resumo)+'</div></div>';
  return h;
}

/* ---------- aba: trilha ---------- */
function abaTrilha(){
  var cs = D.conceitos||[];
  var mods = (D.modulos && D.modulos.length) ? D.modulos : (function(){
    var vis = {}, r = [];
    cs.forEach(function(c){ if(!vis[c.modulo]){ vis[c.modulo]=1; r.push({id:c.modulo,nome:c.modulo}) } });
    return r;
  })();
  var h = '<div class="cartao"><b>Lacuna</b> é conceito ainda não dominado de que outro '+
          'conceito depende. Ele vem antes, mesmo que pareça fora de ordem.</div>';
  mods.forEach(function(m){
    var lista = cs.filter(function(c){ return c.modulo===m.id });
    if(!lista.length) return;
    var ok = lista.filter(function(c){ return niv(c)===3 }).length;
    h += '<div class="mod"><h3>'+esc(m.nome)+' <span>'+ok+" de "+lista.length+'</span></h3><div class="grade">';
    lista.forEach(function(c){
      var n = niv(c);
      var falta = (c.prereq||[]).map(function(p){
        return cs.filter(function(x){ return x.id===p })[0];
      }).filter(function(q){ return q && niv(q)<3 });
      h += '<div class="cnc d'+n+'"><b>'+esc(c.dominio)+" "+esc(c.nome)+'</b>'+
        '<span class="meta">'+NOME[n]+(c.proxima ? " · volta "+esc(c.proxima) : "")+'</span>'+
        (falta.length ? '<div class="chips">'+falta.map(function(q){
            return '<span class="chip alerta">falta '+esc(q.nome)+'</span>' }).join("")+'</div>' : "")+
        (c.erro && c.erro!=="-" ? '<div class="erro">'+esc(c.erro)+'</div>' : "")+
        '</div>';
    });
    h += "</div></div>";
  });
  return h;
}

/* ---------- aba: estudar ---------- */
var baralho = [], i = 0, virada = false, placar = {ok:[],nao:[]};
function abaEstudar(){
  baralho = (D.flashcards||[]).slice(); i=0; virada=false; placar={ok:[],nao:[]};
  if(!baralho.length) return '<div class="cartao vazio">Nenhum flashcard ainda. '+
    'Peça ao Claude: transforma esse módulo em flashcards.</div>';
  return '<div id="zona"></div>';
}
function pintarCarta(){
  var z = document.getElementById("zona"); if(!z) return;
  if(i >= baralho.length){
    var lin = [];
    if(placar.ok.length) lin.push("acertei: "+placar.ok.join(", "));
    if(placar.nao.length) lin.push("errei: "+placar.nao.join(", "));
    var txt = "Flashcards de "+hoje+", "+(D.assunto||"")+". "+lin.join(". ")+".";
    z.innerHTML = '<div class="cartao"><h3>Fim do baralho</h3><p>'+
      placar.ok.length+" certos, "+placar.nao.length+" errados, de "+baralho.length+'.</p>'+
      '<div class="saida"><b>Para isso entrar no seu histórico</b>, cole o texto abaixo no '+
      'Claude. A página não escreve arquivo sozinha.'+
      '<code id="res">'+esc(txt)+'</code>'+
      '<button class="bt forte" id="btcopiar" onclick="copiar()">copiar</button></div></div>'+
      '<div class="acoes"><button class="bt" onclick="reiniciar()">de novo</button></div>';
    return;
  }
  var c = baralho[i];
  z.innerHTML = '<div class="carta" onclick="virar()">'+
      '<div class="rot">'+(virada?"verso":"frente")+(c.conceito?" · "+esc(c.conceito):"")+'</div>'+
      '<div class="txt">'+esc(virada?c.verso:c.frente)+'</div>'+
      '<div class="dica">'+(virada?"":"clique para ver a resposta")+'</div></div>'+
    (virada ? '<div class="acoes">'+
      '<button class="bt nao" onclick="marcar(0)">errei</button>'+
      '<button class="bt ok" onclick="marcar(1)">acertei</button></div>' : "")+
    '<div class="passo">'+(i+1)+" de "+baralho.length+'</div>';
}
function virar(){ virada = true; pintarCarta() }
function marcar(ok){
  var c = baralho[i];
  (ok ? placar.ok : placar.nao).push(c.conceito || String(c.frente).slice(0,30));
  i++; virada = false; pintarCarta();
}
function reiniciar(){ i=0; virada=false; placar={ok:[],nao:[]}; pintarCarta() }
function copiar(){
  var t = document.getElementById("res").textContent;
  var b = document.getElementById("btcopiar");
  function manual(){
    var r = document.createRange();
    r.selectNode(document.getElementById("res"));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(r);
    b.textContent = "selecionado, use Ctrl+C";
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ b.textContent = "copiado" }, manual);
  } else manual();
}

/* ---------- aba: material ---------- */
function abaMaterial(){
  var a = D.aulas||[];
  if(!a.length) return '<div class="cartao vazio">Nenhuma aula escrita ainda. '+
    'Depois de uma aula, peça: guarda essa aula em arquivo.</div>';
  return '<div id="lista">'+a.map(function(x,k){
      return '<button class="item" onclick="abrirAula('+k+')"><b>'+esc(x.titulo)+'</b>'+
             '<span class="meta">'+esc(x.modulo||"")+'</span></button>';
    }).join("")+'</div><div id="leitor"></div>';
}
function abrirAula(k){
  var x = (D.aulas||[])[k];
  document.getElementById("lista").hidden = true;
  document.getElementById("leitor").innerHTML =
    '<button class="bt" onclick="voltarLista()" style="max-width:140px">voltar</button>'+
    '<div class="cartao" style="margin-top:14px"><h3>'+esc(x.titulo)+'</h3>'+
    '<div class="leitura">'+md(x.conteudo)+'</div></div>';
  window.scrollTo({top:0,behavior:"smooth"});
}
function voltarLista(){
  document.getElementById("lista").hidden = false;
  document.getElementById("leitor").innerHTML = "";
}

/* ---------- aba: fontes ---------- */
function abaFontes(){
  var f = D.fontes||{}, v = f.verificadas||[], n = f.naoVerificadas||[];
  var h = '<div class="cartao">Regra deste sistema: <b>nenhuma URL é escrita sem ter sido '+
          'aberta</b>. O que aparece em amarelo foi lembrado e ainda não conferido.</div>';
  h += "<h2>Verificadas</h2>";
  h += v.length ? v.map(function(s){
    return '<div class="fonte"><b>'+esc(s.titulo)+'</b><div class="meta">'+
      esc(s.autor||"")+" · "+esc(s.ano||"")+" · nível "+esc(s.nivel||"?")+
      " · aberta em "+esc(s.acessada||"?")+'</div>'+
      (s.url ? '<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.url)+'</a>' : "")+
      (s.nota ? '<div class="meta" style="white-space:normal">'+esc(s.nota)+'</div>' : "")+
      '</div>';
  }).join("") : '<div class="vazio">Nenhuma ainda.</div>';
  h += "<h2>Não verificadas</h2>";
  h += n.length ? n.map(function(s){
    return '<div class="fonte nv"><b>'+esc(s.titulo)+'</b><div class="meta">'+
      "citada de memória, não aberta"+(s.busca ? " · procurar por: "+esc(s.busca) : "")+
      '</div></div>';
  }).join("") : '<div class="vazio">Nenhuma pendente.</div>';
  return h;
}

/* ---------- montagem ---------- */
var ABAS = [
  {id:"hoje",     nome:"Hoje",     fn:abaHoje,     selo:function(){ return vencidos().length }},
  {id:"trilha",   nome:"Trilha",   fn:abaTrilha},
  {id:"estudar",  nome:"Estudar",  fn:abaEstudar,  selo:function(){ return (D.flashcards||[]).length }},
  {id:"material", nome:"Material", fn:abaMaterial},
  {id:"fontes",   nome:"Fontes",   fn:abaFontes}
];
function ir(id){
  var a = ABAS.filter(function(x){ return x.id===id })[0];
  document.getElementById("palco").innerHTML = a.fn();
  var bs = document.querySelectorAll(".aba");
  for(var k=0;k<bs.length;k++) bs[k].setAttribute("aria-selected", bs[k].dataset.id===id);
  if(id==="estudar") pintarCarta();
  try{ localStorage.setItem("aba", id) }catch(e){}
}
function trocarTema(){
  var r = document.documentElement;
  var novo = r.dataset.tema==="escuro" ? "claro" : "escuro";
  r.dataset.tema = novo;
  try{ localStorage.setItem("tema", novo) }catch(e){}
}
function iniciar(){
  try{ var t = localStorage.getItem("tema"); if(t) document.documentElement.dataset.tema = t }catch(e){}
  if(!D){
    document.getElementById("titulo").textContent = "Painel sem dados";
    document.getElementById("objetivo").textContent =
      "O arquivo dados.js nao foi encontrado ao lado deste painel. Peca ao Claude: atualiza o painel.";
    return;
  }
  document.getElementById("migalha").textContent =
    "Study Machine · atualizado em "+(D.atualizado||"?");
  document.getElementById("titulo").textContent = D.assunto||"Estudo";
  document.getElementById("objetivo").textContent = D.objetivo||"";
  document.title = (D.assunto||"Estudo")+" · painel";

  var cs = D.conceitos||[], tot = cs.length||1;
  var por = [3,2,1,0].map(function(k){
    return [cs.filter(function(c){ return niv(c)===k }).length, k];
  });
  document.getElementById("barra").innerHTML = por.filter(function(p){ return p[0] })
    .map(function(p){ return '<i style="width:'+(p[0]/tot*100)+"%;background:"+COR[p[1]]+'"></i>' })
    .join("");
  document.getElementById("legenda").innerHTML =
    "<span><b>"+por[0][0]+" de "+cs.length+"</b> conceitos dominados</span>"+
    por.map(function(p){
      return '<span><i class="pt" style="background:'+COR[p[1]]+'"></i>'+p[0]+" "+NOME[p[1]]+"</span>";
    }).join("");

  document.getElementById("abas").innerHTML = ABAS.map(function(a){
    var n = a.selo ? a.selo() : 0;
    return '<button class="aba" role="tab" data-id="'+a.id+'" onclick="ir(\''+a.id+'\')">'+
           a.nome+(n ? '<span class="selo">'+n+'</span>' : "")+'</button>';
  }).join("");

  document.getElementById("rodape").textContent =
    (D.sessoes||[]).length+" sessões · gerado do grafo, não editado à mão";

  var inicial = "hoje";
  try{ inicial = localStorage.getItem("aba") || "hoje" }catch(e){}
  ir(ABAS.some(function(a){ return a.id===inicial }) ? inicial : "hoje");
}
iniciar();
</script>
</body>
</html>
